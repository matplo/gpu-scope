name: Publish to PyPI

# Trusted Publishing (OIDC) -- no PyPI token is stored anywhere. The publish
# job authenticates to PyPI using a short-lived token minted for *this
# exact* workflow run, which PyPI accepts only because matplo/gpu-scope +
# this workflow file + the "pypi" environment below were registered as a
# trusted publisher in the PyPI web UI beforehand.
#
# Runs on a published GitHub Release, or manually (Actions tab -> Run
# workflow) for a re-run without cutting a new release.

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
